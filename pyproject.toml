[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-cvar-anchor"
version = "0.1.0"
description = "Deep CVaR anchor regression with discrete environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "click>=8"]

[project.optional-dependencies]
datasets = ["pandas>=2", "pyarrow>=14"]
experiments = ["pandas>=2", "matplotlib>=3.7", "PyYAML>=6", "scipy>=1.10", "xarray>=2023", "fsspec[http]>=2023", "torchvision>=0.17"]
dev = ["black>=23"]
baselines = ["catboost>=1.2", "xgboost>=3", "pytabkit>=1.7", "scikit-learn>=1.5", "pandas>=2", "scipy>=1.10"]

[tool.setuptools]
packages = ["deep_cvar_anchor"]

[tool.black]
line-length = 100
extend-exclude = "archive/"
