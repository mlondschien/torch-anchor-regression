[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-anchor-regression"
version = "0.1.0"
description = "CVaR anchor regression losses for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "click>=8"]

[project.optional-dependencies]
datasets = ["pandas>=2", "pyarrow>=14"]
experiments = ["pandas>=2", "matplotlib>=3.7", "PyYAML>=6", "scipy>=1.10", "xarray>=2023", "fsspec[http]>=2023", "torchvision>=0.17"]
dev = ["black>=23", "pre-commit>=3", "pytest>=8"]
baselines = ["catboost>=1.2", "xgboost>=3", "pytabkit>=1.7", "scikit-learn>=1.5", "pandas>=2", "scipy>=1.10"]

[tool.setuptools]
packages = ["torch_anchor_regression"]

[tool.black]
line-length = 100
extend-exclude = "archive/|experiments/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "experiments"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort and pyupgrade; black formats, so no line-length errors.
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["torch_anchor_regression", "datasets", "scripts"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["^archive/", "^experiments/"]
